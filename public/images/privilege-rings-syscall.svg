<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">Crossing from user space (Ring 3) to kernel space (Ring 0) via syscall</title>
  <desc id="d">A user program loads arguments into registers and runs syscall, trapping into the kernel entry point at Ring 0, executing sys_write, and returning via sysretq with RAX holding bytes written or negative errno.</desc>
  <rect width="1200" height="470" rx="24" fill="#FCFBF8"/>
  <rect x="1" y="1" width="1198" height="468" rx="23" fill="none" stroke="#E5E0D5" stroke-width="2"/>
  <text x="48" y="58" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1C1915">User space to kernel space: one syscall round trip</text>
  <text x="48" y="86" font-family="system-ui, sans-serif" font-size="15" fill="#6F6659">User code cannot touch hardware directly. The CPU hardware gate enforces the privilege switch.</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#BC4114"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F766E"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif">
    <text x="70" y="136" font-size="14" font-weight="700" letter-spacing="1.5" fill="#BC4114">RING 3 · USER SPACE (UNPRIVILEGED)</text>
    <rect x="48" y="150" width="340" height="222" rx="16" fill="#F7E8DE" stroke="#BC4114" stroke-width="2"/>
    <rect x="72" y="176" width="292" height="78" rx="10" fill="#FFFFFF" stroke="#BC4114"/>
    <text x="90" y="204" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700" fill="#1C1915">RAX = 1 (sys_write)</text>
    <text x="90" y="226" font-family="ui-monospace, monospace" font-size="13" fill="#45403A">RDI = fd · RSI = buf · RDX = len</text>
    <text x="90" y="246" font-family="ui-monospace, monospace" font-size="13" fill="#6F6659">arg 4 uses R10 (not RCX)</text>
    <rect x="72" y="274" width="292" height="74" rx="10" fill="#FFFFFF" stroke="#D2CABB"/>
    <text x="218" y="305" text-anchor="middle" font-weight="700" font-size="15" fill="#1C1915">Back in Rust std::io</text>
    <text x="218" y="329" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#45403A">RAX &lt; 0 → Err(errno)</text>

    <rect x="436" y="150" width="286" height="222" rx="16" fill="#EAF1F8" stroke="#0369A1" stroke-width="2"/>
    <text x="579" y="182" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.5" fill="#0369A1">CPU PRIVILEGE GATE</text>
    <rect x="460" y="200" width="238" height="68" rx="10" fill="#FFFFFF" stroke="#0369A1"/>
    <text x="579" y="226" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#1C1915">syscall (x86-64)</text>
    <text x="579" y="249" text-anchor="middle" font-size="12.5" fill="#0369A1">RCX←RIP · R11←RFLAGS · CPL←0</text>
    <rect x="460" y="282" width="238" height="66" rx="10" fill="#FFFFFF" stroke="#0369A1"/>
    <text x="579" y="308" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#1C1915">sysretq</text>
    <text x="579" y="331" text-anchor="middle" font-size="12.5" fill="#0369A1">restores RIP/RFLAGS · CPL←3</text>

    <text x="794" y="136" font-size="14" font-weight="700" letter-spacing="1.5" fill="#0F766E">RING 0 · LINUX KERNEL</text>
    <rect x="772" y="150" width="380" height="222" rx="16" fill="#E6F2F0" stroke="#0F766E" stroke-width="2"/>
    <rect x="796" y="176" width="332" height="80" rx="10" fill="#FFFFFF" stroke="#0F766E"/>
    <text x="962" y="206" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#1C1915">entry_SYSCALL_64 (MSR_LSTAR)</text>
    <text x="962" y="232" text-anchor="middle" font-size="13" fill="#45403A">Saves user regs on kernel stack</text>
    <rect x="796" y="274" width="332" height="74" rx="10" fill="#FFFFFF" stroke="#0F766E"/>
    <text x="962" y="304" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#0F766E">ksys_write() → VFS / TTY</text>
    <text x="962" y="328" text-anchor="middle" font-size="13" fill="#45403A">Validates user pointer · writes bytes</text>

    <line x1="392" y1="226" x2="430" y2="226" stroke="#BC4114" stroke-width="2.5" marker-end="url(#ar)"/>
    <line x1="726" y1="226" x2="766" y2="226" stroke="#BC4114" stroke-width="2.5" marker-end="url(#ar)"/>
    <line x1="766" y1="312" x2="726" y2="312" stroke="#0F766E" stroke-width="2.5" marker-end="url(#at)"/>
    <line x1="430" y1="312" x2="392" y2="312" stroke="#0F766E" stroke-width="2.5" marker-end="url(#at)"/>

    <rect x="48" y="396" width="1104" height="48" rx="12" fill="#F3F0E9" stroke="#E5E0D5"/>
    <text x="72" y="426" font-size="14" fill="#45403A">Hot read-only queries like <tspan font-family="ui-monospace, monospace" font-weight="700" fill="#1C1915">Instant::now()</tspan> skip this trap via <tspan font-weight="700" fill="#0F766E">vDSO</tspan> — reading a kernel-mapped clock page directly in Ring 3.</text>
  </g>
</svg>
