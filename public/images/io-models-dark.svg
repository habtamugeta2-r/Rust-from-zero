<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">Three Linux I/O models: blocking, epoll, and io_uring</title>
  <desc id="d">Blocking read sleeps the thread per request; epoll multiplexes readiness across many sockets using syscalls; io_uring shares submission and completion ring buffers in memory to batch disk and network I/O.</desc>
  <rect width="1200" height="470" rx="24" fill="#1C1A17"/>
  <rect x="1" y="1" width="1198" height="468" rx="23" fill="none" stroke="#2D2A24" stroke-width="2"/>
  <text x="48" y="58" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#ECE7DD">Blocking I/O vs epoll vs io_uring</text>
  <text x="48" y="86" font-family="system-ui, sans-serif" font-size="15" fill="#A49B88">Moving from one thread per waiting file descriptor toward shared user/kernel completion queues.</text>
  <g font-family="system-ui, sans-serif">
    <rect x="48" y="130" width="344" height="258" rx="16" fill="#39231A" stroke="#E9743E" stroke-width="2"/>
    <text x="74" y="166" font-size="14" font-weight="700" letter-spacing="1.5" fill="#E9743E">1 · BLOCKING READ()</text>
    <rect x="74" y="186" width="292" height="58" rx="10" fill="#181613" stroke="#E9743E"/>
    <text x="220" y="212" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#ECE7DD">read(fd, buf)</text>
    <text x="220" y="232" text-anchor="middle" font-size="12.5" fill="#A49B88">thread sleeps in kernel</text>
    <rect x="74" y="260" width="292" height="58" rx="10" fill="#181613" stroke="#3E3930"/>
    <text x="220" y="286" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ECE7DD">1 thread = 1 waiting FD</text>
    <text x="220" y="306" text-anchor="middle" font-size="12.5" fill="#A49B88">wakes when data arrives</text>
    <text x="74" y="356" font-size="13.5" fill="#C2BBAF">Simple, but 10k sockets need 10k threads.</text>

    <rect x="428" y="130" width="344" height="258" rx="16" fill="#132B3A" stroke="#38BDF8" stroke-width="2"/>
    <text x="454" y="166" font-size="14" font-weight="700" letter-spacing="1.5" fill="#38BDF8">2 · EPOLL (READINESS)</text>
    <rect x="454" y="186" width="292" height="58" rx="10" fill="#181613" stroke="#38BDF8"/>
    <text x="600" y="212" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#ECE7DD">epoll_wait(epfd)</text>
    <text x="600" y="232" text-anchor="middle" font-size="12.5" fill="#38BDF8">returns list of ready sockets</text>
    <rect x="454" y="260" width="292" height="58" rx="10" fill="#181613" stroke="#3E3930"/>
    <text x="600" y="286" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700" fill="#ECE7DD">then read(fd) per socket</text>
    <text x="600" y="306" text-anchor="middle" font-size="12.5" fill="#A49B88">Tokio/mio · sockets only (not disk)</text>
    <text x="454" y="356" font-size="13.5" fill="#C2BBAF">Handles 100k sockets on a few threads.</text>

    <rect x="808" y="130" width="344" height="258" rx="16" fill="#12322E" stroke="#2DD4BF" stroke-width="2"/>
    <text x="834" y="166" font-size="14" font-weight="700" letter-spacing="1.5" fill="#2DD4BF">3 · IO_URING (COMPLETION)</text>
    <rect x="834" y="186" width="292" height="58" rx="10" fill="#181613" stroke="#2DD4BF"/>
    <text x="980" y="212" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#ECE7DD">SQ ring (mmap) → Kernel</text>
    <text x="980" y="232" text-anchor="middle" font-size="12.5" fill="#2DD4BF">batched reads, writes, accepts</text>
    <rect x="834" y="260" width="292" height="58" rx="10" fill="#181613" stroke="#2DD4BF"/>
    <text x="980" y="286" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700" fill="#ECE7DD">Kernel → CQ ring (mmap)</text>
    <text x="980" y="306" text-anchor="middle" font-size="12.5" fill="#2DD4BF">finished bytes for disk &amp; network</text>
    <text x="834" y="356" font-size="13.5" fill="#C2BBAF">Batched or zero syscalls via shared rings.</text>

    <rect x="48" y="406" width="1104" height="40" rx="10" fill="#232019" stroke="#2D2A24"/>
    <text x="72" y="431" font-size="14" fill="#C2BBAF">Rust's <tspan font-family="ui-monospace, monospace" font-weight="700" fill="#ECE7DD">std::fs</tspan> uses blocking syscalls; <tspan font-weight="700" fill="#38BDF8">Tokio</tspan> uses <tspan font-weight="700" fill="#38BDF8">epoll</tspan> + a blocking file pool; <tspan font-weight="700" fill="#2DD4BF">tokio-uring</tspan> uses <tspan font-weight="700" fill="#2DD4BF">io_uring</tspan>.</text>
  </g>
</svg>
