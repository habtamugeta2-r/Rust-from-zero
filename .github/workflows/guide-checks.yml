name: Guide checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1, thumbv7m-none-eabi
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Configure checking environment
        run: |
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/cargo-target" >> "$GITHUB_ENV"
          echo "RUST_CHECK_HOME=${RUNNER_TEMP}/rust-check" >> "$GITHUB_ENV"
      - name: Install Node dependencies
        run: npm ci
      - name: Audit chapter structure
        run: python3 guide-src/tools/audit.py --strict
      - name: Check Rust examples
        run: |
          mkdir -p "$RUST_CHECK_HOME/ext/main"
          cp guide-src/tools/ext-main-Cargo.toml "$RUST_CHECK_HOME/ext/main/Cargo.toml"
          python3 guide-src/tools/check.py --ext
      - name: Rebuild and test multi-file and target projects
        run: python3 guide-src/tools/check.py --projects --strict-targets
      - name: Verify content, typecheck and build Next.js app
        run: |
          npm run verify:content
          npm run typecheck
          npm run build
