name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Every Monday at 04:00 UTC: proves the examples still compile against a
    # current stable toolchain and current crate versions.
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  guide:
    name: Build and audit the guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        # Pinned: the committed rust-guide.html must be reproducible byte for byte,
        # and pygments decides the syntax-highlighting markup.
        run: python -m pip install --upgrade pip 'pygments==2.21.0'

      - name: Rebuild rust-guide.html
        run: python3 guide-src/tools/build.py

      - name: The committed HTML must match the chapters
        run: git diff --exit-code -- rust-guide.html

      - name: Structural audit must be clean
        run: |
          python3 guide-src/tools/audit.py | tee /tmp/audit.txt
          if grep -qE '^  - ' /tmp/audit.txt; then
            echo "::error::tools/audit.py reported structural remarks (see above)"
            exit 1
          fi

  examples:
    name: Compile every Rust example
    # Compiling ~900 examples needs a full toolchain and takes many minutes, so
    # it runs on a schedule and on demand rather than on every pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/arena/6fcb4a83-rust-from-zero'
    runs-on: ubuntu-latest
    env:
      RUST_CHECK_HOME: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare the crate-example project
        run: |
          mkdir -p ext
          (cd ext && cargo new main --name extmain -q)
          cp guide-src/tools/ext-main-Cargo.toml ext/main/Cargo.toml

      # The failure output is echoed and, for the first few lines, surfaced as
      # ::error:: annotations, so that a red run explains itself in the UI even
      # when the raw log is not available.
      - name: Compile and run the standard-library examples
        run: |
          set +e
          python3 guide-src/tools/check.py > /tmp/std.log 2>&1
          status=$?
          tail -n 30 /tmp/std.log
          if [ $status -ne 0 ]; then
            grep -m 8 -E "^✗|^error" /tmp/std.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Check the crate examples with cargo
        run: |
          set +e
          python3 guide-src/tools/check.py --ext > /tmp/ext.log 2>&1
          status=$?
          tail -n 40 /tmp/ext.log
          if [ $status -ne 0 ]; then
            grep -m 8 -E "^✗|^error|failed to select|no matching package" /tmp/ext.log | sed 's/^/::error::/'
            exit 1
          fi
