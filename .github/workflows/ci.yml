name: Guide CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit-and-build:
    name: Structural audit & HTML build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pygments

      - name: Run structural audit
        run: python3 guide-src/tools/audit.py --strict

      - name: Build single-file HTML and check freshness
        run: |
          python3 guide-src/tools/build.py --strict
          git diff --exit-code rust-guide.html

  check-rust:
    name: Compile-check Rust examples
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare ext workspace
        run: |
          mkdir -p /tmp/rust-check/ext/main/src
          cp guide-src/tools/ext-main-Cargo.toml /tmp/rust-check/ext/main/Cargo.toml
          echo 'fn main() {}' > /tmp/rust-check/ext/main/src/main.rs

      - name: Run check.py
        env:
          RUST_CHECK_HOME: /tmp/rust-check
        run: python3 guide-src/tools/check.py --nocache --ext
