[package]
name = "extmain"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["getrandom"] }
actix-web = "4"
axum = { version = "0.8.9", features = ["macros", "ws", "multipart"] }
bincode = "1.3"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossbeam = "0.8.5"
csv = "1.4.0"
embedded-hal = "1.0.0"
env_logger = "0.11"
eyre = "0.6"
futures = "0.3.34"
heapless = "0.9.3"
itertools = "0.15.0"
log = "0.4"
miette = { version = "7", features = ["fancy"] }
ndarray = "0.17.2"
parking_lot = "0.13.0"
postcard = "1.1.3"
proptest = "1.12.0"
rand = "0.10.3"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmp-serde = "1"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util", "timeout", "limit", "retry"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "timeout", "limit", "compression-gzip", "fs", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ureq = "3"
wasm-bindgen = "0.2.130"

# Smaller and faster example builds: no debug information
[profile.dev]
debug = 0
